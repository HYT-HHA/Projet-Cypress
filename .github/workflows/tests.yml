# Lancement automatique des tests Cypress sur GitHub Actions
name: Tests Cypress

on:
  # À chaque envoi de code sur la branche main
  push:
    branches: [main]

  # À chaque Pull Request vers main : tests seulement (ni publication, ni e-mail)
  pull_request:
    branches: [main]

  # Manuellement, depuis l'onglet Actions (bouton « Run workflow »)
  workflow_dispatch:
    inputs:
      environnement:
        description: Environnement à tester
        type: choice
        options: [recette, preprod]
        default: recette

  # Chaque jour à 4 h UTC (6 h en été, 5 h en hiver à Paris)
  schedule:
    - cron: '0 4 * * *'

# Droits minimum : le workflow ne fait que lire le code
permissions:
  contents: read

# Si une nouvelle exécution démarre, la précédente encore en cours est annulée
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Parallélisation : les fichiers de tests sont répartis entre 2 machines qui tournent en même temps
  # (répartition faite par cypress.config.js, à partir de PARTIE et NB_PARTIES)
  tests-partie:
    name: Tests partie ${{ matrix.partie }}/2 (${{ inputs.environnement || 'recette' }})
    # Version d'Ubuntu fixée (pas « ubuntu-latest ») : on choisit quand migrer,
    # après avoir testé, au lieu de subir les changements de GitHub
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      # Si une partie échoue, l'autre continue : on veut le résultat de tous les tests
      fail-fast: false
      matrix:
        partie: [1, 2]

    env:
      # Push et planification : recette ; lancement manuel : l'environnement choisi
      ENVIRONNEMENT: ${{ inputs.environnement || 'recette' }}
      PARTIE: ${{ matrix.partie }}
      NB_PARTIES: 2

    steps:
      - name: Récupérer le code du projet
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Installation explicite du navigateur de Cypress, pour ne pas dépendre
      # des scripts d'installation automatiques de npm
      - name: Installer Cypress
        run: npx cypress install

      - name: Lancer les tests
        run: npm run test:${{ env.ENVIRONNEMENT }}
        env:
          # Le secret GitHub est transmis à Cypress, qui le lit avec cy.env(['motDePasse'])
          CYPRESS_motDePasse: ${{ secrets.MOT_DE_PASSE }}

      # Résultats bruts de cette partie, regroupés ensuite par le job « rapport »
      # (même si des tests ont échoué : c'est là que le rapport est le plus utile)
      - name: Transmettre les résultats de la partie ${{ matrix.partie }}
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: resultats-allure-partie-${{ matrix.partie }}
          path: allure-results
          if-no-files-found: error
          retention-days: 1

  # Synthèse des parties : c'est ce job, nommé « Tests (recette) », que la protection de main exige.
  # Il réussit seulement si toutes les parties ont réussi.
  tests:
    name: Tests (${{ inputs.environnement || 'recette' }})
    needs: tests-partie
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Vérifier que toutes les parties ont réussi
        run: |
          echo "Résultat des parties : ${{ needs.tests-partie.result }}"
          test "${{ needs.tests-partie.result }}" = "success"

  # Regroupe les résultats des parties en un seul rapport Allure
  rapport:
    name: Rapport Allure
    needs: tests-partie
    # Même si des tests ont échoué : c'est justement là que le rapport est le plus utile
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      ENVIRONNEMENT: ${{ inputs.environnement || 'recette' }}
      # Adresse du rapport publié sur GitHub Pages (seul le rapport de recette y est publié)
      URL_RAPPORT: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

    steps:
      - name: Récupérer le code du projet
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci
        env:
          # Allure n'a pas besoin du navigateur de Cypress : on évite son téléchargement
          CYPRESS_INSTALL_BINARY: 0

      - name: Récupérer les résultats de toutes les parties
        uses: actions/download-artifact@v8
        with:
          pattern: resultats-allure-partie-*
          # Les résultats des parties sont fusionnés dans un seul dossier
          merge-multiple: true
          path: allure-results

      # L'historique est stocké avec le rapport publié : on le récupère avant de générer
      # le nouveau rapport. Au tout premier lancement, il n'existe pas encore.
      - name: Récupérer l'historique du rapport (recette)
        if: ${{ !cancelled() && env.ENVIRONNEMENT == 'recette' && github.event_name != 'pull_request' }}
        run: |
          mkdir -p allure-history
          curl --fail --silent --show-error --location "$URL_RAPPORT/history.jsonl" \
            --output allure-history/history.jsonl \
            || { rm -f allure-history/history.jsonl; echo "Pas d'historique précédent (premier lancement)"; }

      - name: Générer le rapport Allure
        if: ${{ !cancelled() }}
        run: |
          npm run report:generate
          # L'historique est publié avec le rapport, pour être récupéré au prochain lancement
          if [ -f allure-history/history.jsonl ]; then
            cp allure-history/history.jsonl allure-report/history.jsonl
          fi

      # Recette : le rapport est préparé pour GitHub Pages (job « publication » ci-dessous)
      - name: Préparer la publication du rapport (recette)
        if: ${{ !cancelled() && env.ENVIRONNEMENT == 'recette' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      # Tous les cas : une copie du rapport est téléchargeable dans le résumé de l'exécution.
      # C'est le seul rapport pour les autres environnements et les Pull Requests,
      # et une copie de secours pour la recette si la mise en ligne échoue.
      - name: Joindre le rapport à l'exécution (${{ env.ENVIRONNEMENT }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          # Pull Request : « rapport-allure-pr-<numéro> » ; sinon : « rapport-allure-<environnement> »
          name: rapport-allure-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || env.ENVIRONNEMENT }}
          path: allure-report
          retention-days: 30

  # Relecture automatique du code par ESLint, en parallèle des tests
  # (sans « needs » : démarre en même temps que les parties de tests)
  qualite:
    name: Qualité du code (ESLint)
    # Inutile la nuit : le code n'a pas changé depuis le dernier push
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Récupérer le code du projet
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci
        env:
          # ESLint n'a pas besoin du navigateur de Cypress : on évite son téléchargement
          CYPRESS_INSTALL_BINARY: 0

      - name: Relire le code avec ESLint
        run: npm run lint

  publication:
    name: Publication du rapport
    needs: rapport
    # Publié même si des tests ont échoué, mais seulement pour la recette, hors Pull Request
    if: ${{ !cancelled() && (inputs.environnement || 'recette') == 'recette' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Droits nécessaires uniquement pour publier sur GitHub Pages
    permissions:
      pages: write
      id-token: write

    # Deux publications ne doivent jamais se chevaucher
    concurrency:
      group: publication-rapport
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}

    # Adresse du rapport publié, transmise au job « notification »
    outputs:
      url_rapport: ${{ steps.deploiement.outputs.page_url }}

    steps:
      - name: Publier le rapport sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v5

  notification:
    name: Notification par e-mail
    needs: [tests, rapport, publication]
    # Envoyé à chaque exécution hors Pull Request, réussie ou non (pour n'alerter
    # qu'en cas d'échec : ajouter « needs.tests.result == 'failure' »)
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    env:
      ENVIRONNEMENT: ${{ inputs.environnement || 'recette' }}
      # Réussite seulement si les tests passent ET si le rapport est en ligne
      # (« skipped » = publication non prévue, par exemple en preprod : ce n'est pas un échec)
      RESULTAT: ${{ needs.tests.result == 'success' && (needs.publication.result == 'success' || needs.publication.result == 'skipped') && '✅ Réussite' || '❌ Échec' }}
      ETAT_TESTS: ${{ needs.tests.result == 'success' && '✅' || '❌' }}
      ETAT_PUBLICATION: ${{ needs.publication.result == 'success' && '✅' || needs.publication.result == 'skipped' && '➖ (non publié pour cet environnement)' || '❌' }}

    steps:
      # Action tierce : épinglée sur un commit précis (v22) plutôt que sur une étiquette,
      # car elle manipule un secret. Une étiquette peut être déplacée, pas un commit.
      - name: Envoyer le résultat par e-mail
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968 # v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: qa.automation.fr@gmail.com
          password: ${{ secrets.GMAIL_MOT_DE_PASSE }}
          from: Tests Cypress <qa.automation.fr@gmail.com>
          to: qa.automation.fr@gmail.com
          subject: '${{ env.RESULTAT }} - Tests Cypress (${{ env.ENVIRONNEMENT }})'
          body: |
            Résultat : ${{ env.RESULTAT }}
            Tests : ${{ env.ETAT_TESTS }}
            Rapport en ligne : ${{ env.ETAT_PUBLICATION }}
            Environnement : ${{ env.ENVIRONNEMENT }}
            Déclencheur : ${{ github.event_name }}
            Commit : ${{ github.sha }}

            Rapport Allure : ${{ needs.publication.result == 'success' && needs.publication.outputs.url_rapport || 'à télécharger dans le détail de l''exécution (Artifacts)' }}
            Détail de l'exécution : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
